# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven
# Note: Any changes to this workflow would be used only after merging into develop
name: Build e2e tests

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: k8s-runner-e2e
    # We allow builds:
    # 1) When triggered manually
    # 2) When it's a merge into a branch
    # 3) For PRs that are labeled as build and
    #  - It's a code change
    #  - A build label was just added
    # A bit complex, but prevents builds when other labels are manipulated
    if: >
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'push'
      || (contains(github.event.pull_request.labels.*.name, 'build')
          && (github.event.action != 'labeled' || github.event.label.name == 'build')
          )
    strategy:
      matrix:
        tests: [bigquery, common, gcs, pubsub, spanner, gcscreate, gcsdelete, gcsmove, bigqueryexecute, gcscopy, datastore, bigtable]
      fail-fast: false
    steps:
      # Pinned 1.0.0 version
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: plugin
          persist-credentials: false
      - uses: dorny/paths-filter@4512585405083f25c027a35db413c2b3b9006d50
        # Pinned version 2.11.1
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'push'
        id: filter
        with:
          working-directory: plugin
          filters: |
            e2e-test:
              - '**/e2e-test/**'
      - name: Checkout e2e test repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cdapio/cdap-e2e-tests
          path: e2e
          persist-credentials: false
      - name: Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ github.workflow }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ github.workflow }}
      - name: Run required e2e tests
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'push' && steps.filter.outputs.e2e-test == 'false'
        env:
          MATRIX_TESTS: ${{ matrix.tests }}
        run: python3 e2e/src/main/scripts/run_e2e_test.py --testRunner **/"$MATRIX_TESTS"/**/TestRunnerRequired.java
      - name: Run all e2e tests
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.filter.outputs.e2e-test == 'true'
        env:
          MATRIX_TESTS: ${{ matrix.tests }}
        run: python3 e2e/src/main/scripts/run_e2e_test.py --testRunner **/"$MATRIX_TESTS"/**/TestRunner.java
      - name: Upload debug files 
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Debug files - ${{ matrix.tests }}
          path: ./**/target/e2e-debug
      - name: Upload files to GCS
        uses: google-github-actions/upload-cloud-storage@c0f6160ff80057923ff50e5e567695cea181ec23 # v2
        if: always()
        with:
          path: ./plugin/target/cucumber-reports
          destination: e2e-tests-cucumber-reports/${{ github.event.repository.name }}/${{ github.ref }}/${{ matrix.tests }}
      - name: Cucumber Report URL
        if: always()
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          GITHUB_REF_NAME: ${{ github.ref }}
          MATRIX_TESTS: ${{ matrix.tests }}
        run: echo "https://storage.googleapis.com/e2e-tests-cucumber-reports/${REPO_NAME}/${GITHUB_REF_NAME}/${MATRIX_TESTS}/cucumber-reports/advanced-reports/cucumber-html-reports/overview-features.html"
